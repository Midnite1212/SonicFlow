[project]
name = "sonicflow"
version = "0.0.1"
description = "Local, low-latency dictation engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jiwer>=3.0",
    "numpy>=2.0",
    "soundfile>=0.12",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
sonicflow = "sonicflow.server:main"
sonicflow-bench = "sonicflow.bench.cli:main"
sonicflow-mic = "sonicflow.mic:main"
sonicflow-service = "sonicflow.service:main"

[project.optional-dependencies]
parakeet = [
    "parakeet-mlx>=0.5.3",
]
whisper = [
    "mlx-whisper>=0.4.3",
]
llm = [
    "mlx-lm>=0.32.2",
]
mic = [
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonicflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Backend load() is an optional hook, not an abstract method.
ignore = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
